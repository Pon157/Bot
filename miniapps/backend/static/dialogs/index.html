<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Спокойный рассвет — История диалогов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/shared/style.css"/>
<style>
  #chat-view { display:none; }
  #chat-messages { display:flex; flex-direction:column; }
  .back-btn { display:flex; align-items:center; gap:6px; color:var(--hint); font-size:14px; margin-bottom:14px; cursor:pointer; }
  .status-pill { display:inline-block; font-size:11px; padding:3px 9px; border-radius:20px; margin-left:6px; }
  .status-pill.active  { background:rgba(87,224,143,.18); color:var(--online); }
  .status-pill.pending { background:rgba(255,205,130,.15); color:var(--accent); }
  .status-pill.closed  { background:rgba(107,100,133,.3); color:var(--hint); }
</style>
</head>
<body>

<div id="list-view">
  <h1>История диалогов</h1>
  <div class="subtitle" id="list-subtitle">Все твои обращения к администраторам</div>
  <div class="list" id="appeals-list"></div>
  <div class="empty" id="appeals-empty" style="display:none;">У тебя пока не было обращений</div>
  <div class="loader" id="loader">Загружаем...</div>
</div>

<div id="chat-view">
  <div class="back-btn" id="back-btn">← Все диалоги</div>
  <h1 id="chat-title">Диалог</h1>
  <div class="loader" id="chat-loader" style="display:none;">Загружаем сообщения...</div>
  <div id="chat-messages"></div>
</div>

<script src="/shared/api.js"></script>
<script>
  const STATUS_LABELS = { pending:"Ожидает", active:"В процессе", closed:"Закрыт", cancelled:"Отменён" };

  // Если открыто через /seedialogs (владелец/хед-админ смотрит чужие
  // диалоги) — ссылка будет вида /dialogs/?view_as_user_id=123456.
  const params = new URLSearchParams(location.search);
  const viewAsUserId = params.get("view_as_user_id");
  const qs = viewAsUserId ? `?view_as_user_id=${encodeURIComponent(viewAsUserId)}` : "";
  if (viewAsUserId) {
    document.getElementById("list-subtitle").textContent = `Диалоги пользователя ${viewAsUserId} (режим просмотра)`;
  }

  async function loadAppeals() {
    try {
      const items = await (await apiFetch(`/api/dialogs${qs}`)).json();
      document.getElementById("loader").style.display = "none";
      const list = document.getElementById("appeals-list");
      const empty = document.getElementById("appeals-empty");
      list.innerHTML = "";
      if (!items.length) { empty.style.display = "block"; return; }
      empty.style.display = "none";
      for (const a of items) {
        const el = document.createElement("div");
        el.className = "card row";
        el.style.cursor = "pointer";
        const sc = { active:"active", pending:"pending" }[a.status] ?? "closed";
        el.innerHTML = `
          <div class="avatar">${escapeHtml(a.admin_nickname[0].toUpperCase())}</div>
          <div class="info">
            <div class="nickname">#${a.appeal_id} · ${escapeHtml(a.admin_nickname)}</div>
            <div class="meta">${fmtDate(a.created_at)}
              <span class="status-pill ${sc}">${STATUS_LABELS[a.status] ?? a.status}</span>
            </div>
          </div>`;
        el.addEventListener("click", () => openChat(a.appeal_id, a.admin_nickname));
        list.appendChild(el);
      }
    } catch (e) {
      if (e.message !== "401 Unauthorized")
        document.getElementById("loader").textContent = "Не удалось загрузить данные";
    }
  }

  async function openChat(appealId, nickname) {
    document.getElementById("list-view").style.display = "none";
    document.getElementById("chat-view").style.display = "block";
    document.getElementById("chat-title").textContent = `#${appealId} · ${escapeHtml(nickname)}`;
    const msgs = document.getElementById("chat-messages");
    msgs.innerHTML = "";
    document.getElementById("chat-loader").style.display = "block";

    try {
      const messages = await (await apiFetch(`/api/dialogs/${appealId}/messages${qs}`)).json();
      document.getElementById("chat-loader").style.display = "none";

      for (const m of messages) {
        const isAdmin = m.direction === "admin_to_user";
        const row = document.createElement("div");
        row.className = "msg-row";
        row.style.alignItems = isAdmin ? "flex-end" : "flex-start";

        const bubble = document.createElement("div");
        bubble.className = `msg-bubble ${isAdmin ? "admin" : "user"}${m.is_deleted ? " deleted" : ""}`;

        if (m.is_deleted) {
          bubble.textContent = "Сообщение удалено";
        } else if (m.content_type === "text") {
          bubble.textContent = m.text_preview || "";
        } else {
          if (m.text_preview) {
            const cap = document.createElement("div");
            cap.textContent = m.text_preview;
            cap.style.marginBottom = "6px";
            bubble.appendChild(cap);
          }
          if (m.media_url) renderMedia(bubble, m);
          else bubble.appendChild(Object.assign(document.createElement("span"), { textContent: mediaLabel(m.content_type) }));
        }

        const time = document.createElement("div");
        time.className = "msg-time";
        time.textContent = fmtDateTime(m.created_at) + (m.is_edited ? " · изменено" : "");

        row.appendChild(bubble);
        row.appendChild(time);
        msgs.appendChild(row);
      }
      // прокрутить вниз
      msgs.lastElementChild?.scrollIntoView({ block: "end" });
    } catch (e) {
      document.getElementById("chat-loader").textContent = "Не удалось загрузить сообщения";
    }
  }

  function mediaLabel(type) {
    return { photo:"📷 Фото", video:"🎥 Видео", voice:"🎤 Голосовое", audio:"🎵 Аудио",
      document:"📎 Документ", sticker:"🩶 Стикер", video_note:"⏺ Видеосообщение", animation:"🎞 GIF" }[type] ?? type;
  }

  function renderMedia(container, m) {
    const url = m.media_url;
    if (m.content_type === "photo") {
      const img = document.createElement("img");
      img.src = url; img.className = "msg-media";
      img.loading = "lazy";
      container.appendChild(img);
    } else if (m.content_type === "sticker") {
      // Статические (webp) и видео-стикеры (webm) отображаются как картинка.
      // Анимированные (.tgs, это Lottie) браузер отрисовать не может —
      // в этом случае откатываемся на текстовую подпись вместо битой иконки.
      const img = document.createElement("img");
      img.src = url; img.className = "msg-media"; img.loading = "lazy";
      img.style.maxWidth = "140px";
      img.onerror = () => {
        img.remove();
        container.appendChild(Object.assign(document.createElement("span"), { textContent: mediaLabel("sticker") }));
      };
      container.appendChild(img);
    } else if (["video","video_note","animation"].includes(m.content_type)) {
      const v = document.createElement("video");
      v.src = url; v.controls = true; v.className = "msg-media";
      container.appendChild(v);
    } else if (["voice","audio"].includes(m.content_type)) {
      const a = document.createElement("audio");
      a.src = url; a.controls = true;
      a.style.cssText = "width:100%;margin-top:6px;";
      container.appendChild(a);
    } else {
      const a = document.createElement("a");
      a.href = url; a.textContent = "📎 Открыть файл";
      a.target = "_blank"; a.style.color = "var(--accent)";
      container.appendChild(a);
    }
  }

  document.getElementById("back-btn").addEventListener("click", () => {
    document.getElementById("chat-view").style.display = "none";
    document.getElementById("list-view").style.display = "block";
  });

  loadAppeals();
</script>
</body>
</html>
