<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Спокойный рассвет — Онлайн администрации</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #14101f);
    --text: var(--tg-theme-text-color, #f4f0fb);
    --hint: var(--tg-theme-hint-color, #9d93b8);
    --accent: #ffcd82;
    --card: rgba(255,255,255,0.06);
    --online: #57e08f;
    --offline: #6b6485;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(120% 100% at 50% -10%, #3a2b57 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 40px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 4px 0 4px;
  }
  .subtitle { color: var(--hint); font-size: 14px; margin-bottom: 20px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    backdrop-filter: blur(6px);
  }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #ff8a6b);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #201430; font-size: 18px; flex-shrink: 0;
  }
  .info { flex: 1; min-width: 0; }
  .nickname { font-weight: 600; font-size: 15px; }
  .role { color: var(--hint); font-size: 12px; margin-top: 2px; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; flex-shrink: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.online { background: var(--online); box-shadow: 0 0 8px var(--online); }
  .dot.offline { background: var(--offline); }
  .empty { text-align: center; color: var(--hint); margin-top: 60px; font-size: 14px; }
</style>
</head>
<body>
  <h1>Администрация онлайн</h1>
  <div class="subtitle">Обновляется автоматически каждые 30 секунд</div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" style="display:none;">Пока никого нет на связи</div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  async function load() {
    try {
      const res = await fetch('/api/online', {
        headers: { 'X-Telegram-Init-Data': tg?.initData || '' }
      });
      const admins = await res.json();
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      list.innerHTML = '';
      if (!admins.length) { empty.style.display = 'block'; return; }
      empty.style.display = 'none';

      for (const a of admins) {
        const el = document.createElement('div');
        el.className = 'card';
        const roleLabel = { owner: 'Владелец', head_admin: 'Хед-админ', admin: 'Администратор' }[a.role] || a.role;
        el.innerHTML = `
          <div class="avatar">${a.nickname.slice(0,1).toUpperCase()}</div>
          <div class="info">
            <div class="nickname">${a.nickname}</div>
            <div class="role">${roleLabel}</div>
          </div>
          <div class="status">
            <span class="dot ${a.is_online ? 'online' : 'offline'}"></span>
            ${a.is_online ? 'на связи' : 'не в сети'}
          </div>`;
        list.appendChild(el);
      }
    } catch (e) { console.error(e); }
  }

  load();
  setInterval(load, 30000);
</script>
</body>
</html>
